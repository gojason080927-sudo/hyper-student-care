<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HYPER 교재 제작</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./master.css">
<style>
  .studio-bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #d5dbe3; font-family: "Noto Sans CJK KR", sans-serif; }
  .studio-bar select, .studio-bar button { min-height: 36px; }
  #advanced-panel { width: min(920px, 92vw); margin: 12px auto; }
  #advanced-panel textarea { width: 100%; font: 12px/1.4 monospace; }
  @media print { .studio-bar, #advanced-panel, #note { display: none; } }
</style>
</head>
<body>
<div class="studio-bar">
  <label>학교급 <select id="school">
    <option value="middle">중학교</option>
    <option value="high" selected>고등학교</option>
  </select></label>
  <label>학년 <select id="year">
    <option value="1">1학년</option>
    <option value="2">2학년</option>
    <option value="3" selected>3학년</option>
  </select></label>
  <label>교재명 <input id="series" type="text" placeholder="예: 고1 모의고사 독해" style="width:14em"></label>
  <label>유형 <select id="kind">
    <option value="reading">영어 독해</option>
    <option value="grammar" selected>영어 문법</option>
    <option value="vocab">영어 단어</option>
    <option value="writing">영어 영작</option>
    <option value="math">수학</option>
  </select></label>
  <input id="file" type="file" accept="application/pdf,application/json,.pdf,.json,.txt">
  <button id="build" type="button">교재 만들기 시작</button>
  <button id="sample" type="button" hidden>샘플 열기</button>
  <button id="print" type="button">PDF로 인쇄</button>
  <button id="advanced" type="button">고급 수정</button>
</div>
<div id="advanced-panel" hidden>
  <textarea id="json" rows="8"></textarea>
  <button id="apply" type="button">수정 반영</button>
</div>
<p id="note" style="width:min(920px,92vw);margin:0 auto 12px;font:13px/1.5 sans-serif;color:#8a3b2a"></p>
<div id="preview" class="screen-wrap"></div>
<script type="module">
import { renderBook } from './render.mjs'
import { extractBook } from './extract.mjs'

const files = {
  reading: './samples/reading-g3.json',
  grammar: './samples/grammar-g3.json',
  vocab: './samples/vocab-g3.json',
  writing: './samples/writing-g3.json',
  math: './samples/math-g1.json',
}

const note = document.getElementById('note')
const jsonBox = document.getElementById('json')

function applyChoices(book, fromFile) {
  const school = document.getElementById('school')
  const year = document.getElementById('year')
  const series = document.getElementById('series')
  if (fromFile) {
    if (book.school === 'middle' || book.school === 'high') school.value = book.school
    if (/^g[123]$/.test(book.grade || '')) year.value = book.grade.slice(1)
    if (book.series) series.value = book.series
  }
  book.school = school.value
  book.grade = `g${year.value}`
  if (series.value.trim()) book.series = series.value.trim()
  return book
}

function show(book, fromFile) {
  if (book.error) {
    note.textContent = book.error
    return
  }
  applyChoices(book, fromFile)
  note.textContent = ''
  jsonBox.value = JSON.stringify(book, null, 2)
  const html = renderBook(book)
  const doc = new DOMParser().parseFromString(html, 'text/html')
  document.body.dataset.grade = book.grade || 'g3'
  document.getElementById('preview').innerHTML = doc.querySelector('.screen-wrap').innerHTML
}

async function loadPdfjs() {
  try {
    const pdfjs = await import('./vendor/pdf.mjs')
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdf.worker.mjs', import.meta.url).href
    return pdfjs
  } catch {
    const pdfjs = await import('../../node_modules/pdfjs-dist/build/pdf.mjs')
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('../../node_modules/pdfjs-dist/build/pdf.worker.mjs', import.meta.url).href
    return pdfjs
  }
}

async function textFromPdf(file) {
  const pdfjs = await loadPdfjs()
  const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise
  const pages = []
  for (let i = 1; i <= pdf.numPages; i += 1) {
    const page = await pdf.getPage(i)
    const content = await page.getTextContent()
    pages.push(content.items.map((item) => item.str).join('\n'))
  }
  return pages.join('\n')
}

let picked = null
document.getElementById('file').addEventListener('change', (event) => {
  picked = event.target.files?.[0] ?? null
  note.textContent = picked ? `${picked.name}을 선택했습니다. 교재 만들기 시작을 누르세요.` : ''
})

document.getElementById('build').addEventListener('click', async () => {
  if (!picked) {
    note.textContent = '파일을 선택하세요.'
    return
  }
  const kind = document.getElementById('kind').value
  const name = picked.name.toLowerCase()
  if (name.endsWith('.json')) {
    show(JSON.parse(await picked.text()), true)
    return
  }
  const text = name.endsWith('.pdf') ? await textFromPdf(picked) : await picked.text()
  show(extractBook(text, kind))
})

document.getElementById('apply').addEventListener('click', () => {
  show(JSON.parse(jsonBox.value))
})

document.getElementById('sample').addEventListener('click', async () => {
  const kind = document.getElementById('kind').value
  const res = await fetch(files[kind])
  show(await res.json(), true)
})

document.getElementById('advanced').addEventListener('click', () => {
  const panel = document.getElementById('advanced-panel')
  panel.hidden = !panel.hidden
})
document.getElementById('print').addEventListener('click', () => window.print())
for (const id of ['school', 'year', 'series']) {
  document.getElementById(id).addEventListener('change', () => {
    if (!jsonBox.value) return
    show(JSON.parse(jsonBox.value))
  })
}
</script>
</body>
</html>
