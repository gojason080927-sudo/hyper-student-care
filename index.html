      rel="stylesheet"
    />
    <script>
      ;(function () {
        var path = window.location.pathname
        if (!path.startsWith('/teacher/')) return
        var iconVersion = '3'
        var manifest = document.createElement('link')
        manifest.rel = 'manifest'
        manifest.href = '/teacher/manifest.webmanifest?v=' + iconVersion
        document.head.appendChild(manifest)
        var theme = document.querySelector('meta[name="theme-color"]')
        if (theme) theme.setAttribute('content', '#0B1F4A')
        var icon = document.querySelector('link[rel="icon"]')
        if (icon) {
          icon.setAttribute('href', '/teacher/hyper-teacher-v3-192.png')
          icon.setAttribute('type', 'image/png')
        }
        var icon32 = document.querySelector('link[rel="icon"][sizes="32x32"]')
        if (!icon32) {
          icon32 = document.createElement('link')
          icon32.rel = 'icon'
          icon32.sizes = '32x32'
          icon32.type = 'image/png'
          document.head.appendChild(icon32)
        }
        icon32.href = '/teacher/hyper-teacher-v3-192.png'
        var icon16 = document.querySelector('link[rel="icon"][sizes="16x16"]')
        if (!icon16) {
          icon16 = document.createElement('link')
          icon16.rel = 'icon'
          icon16.sizes = '16x16'
          icon16.type = 'image/png'
          document.head.appendChild(icon16)
        }
        icon16.href = '/teacher/hyper-teacher-v3-192.png'
        var appleIcon = document.querySelector('link[rel="apple-touch-icon"]')
        if (!appleIcon) {
          appleIcon = document.createElement('link')
          appleIcon.rel = 'apple-touch-icon'
          document.head.appendChild(appleIcon)
        }
        appleIcon.href = '/teacher/hyper-teacher-v3-apple-touch.png'
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker
            .register('/teacher/sw.js', { scope: '/teacher/' })
            .catch(function () {})
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
