      rel="stylesheet"
    />
    <!-- Default teacher manifest is in the raw HTML so Android WebAPK minting
         can find it at /teacher/mobile without executing later React code.
         The head script below rewrites or removes this link by path. -->
    <link rel="manifest" id="app-manifest" href="/teacher/manifest.webmanifest" />
    <script>
      ;(function () {
        var path = window.location.pathname
        var manifest = document.getElementById('app-manifest')
        var theme = document.querySelector('meta[name="theme-color"]')
        var isTeacher = path.startsWith('/teacher/')
        var isCare = path === '/care' || path.startsWith('/care/')

        if (!isTeacher && !isCare) {
          if (manifest) manifest.parentNode.removeChild(manifest)
          return
        }

        if (theme) theme.setAttribute('content', '#0B1F4A')

        if (isTeacher) {
          if (manifest) manifest.href = '/teacher/manifest.webmanifest?v=6-installable'
          var icon = document.querySelector('link[rel="icon"]')
          if (icon) {
            icon.setAttribute('href', '/teacher/hyper-teacher-icon-v6-192.png')
            icon.setAttribute('type', 'image/png')
          }
          var appleIcon = document.querySelector('link[rel="apple-touch-icon"]')
          if (!appleIcon) {
            appleIcon = document.createElement('link')
            appleIcon.rel = 'apple-touch-icon'
            document.head.appendChild(appleIcon)
          }
          appleIcon.href = '/teacher/hyper-teacher-icon-v6-192.png'
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker
              .register('/teacher/sw.js', { scope: '/teacher/' })
              .catch(function () {})
          }
          return
        }

        if (manifest) manifest.href = '/care/manifest.webmanifest?v=6-installable'
        var careIcon = document.querySelector('link[rel="icon"]')
        if (careIcon) {
          careIcon.setAttribute('href', '/care/hyper-parent-icon-v6-192.png')
          careIcon.setAttribute('type', 'image/png')
        }
        var careApple = document.querySelector('link[rel="apple-touch-icon"]')
        if (!careApple) {
          careApple = document.createElement('link')
          careApple.rel = 'apple-touch-icon'
          document.head.appendChild(careApple)
        }
        careApple.href = '/care/hyper-parent-icon-v6-192.png'
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker
            .register('/care/sw.js', { scope: '/care/' })
            .catch(function () {})
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
